<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Demonstração de Vitrine</title>
  <meta name="description" content="Vitrine online da HM Redários — consulte nosso catálogo de redários e brinquedos de cordas náuticas com fotos e preços atualizados.">

  <meta name="author" content="HM Redários">
  <meta name="theme-color" content="#1A1A1A">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark:         #1A1A1A;
      --dark-2:       #242424;
      --dark-3:       #303030;
      --yellow:       #FFD400;
      --yellow-light: #FFE66B;
      --yellow-dark:  #D9B400;
      --gray-900:     #1F1F1F;
      --gray-200:     #E4E4E4;
      --white:        #FFFFFF;
      --text:         #1F1F1F;
      --header-h:     96px;
      --badge-h:      0px;
      --ease:         0.25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); }
    a { text-decoration: none; color: inherit; }
    img { display: block; }

    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ===== HEADER (idêntico ao site principal) ===== */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(10,10,10,0.08);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 96px; gap: 16px;
    }

    .logo-link { display: flex; align-items: center; gap: 12px; transition: transform var(--ease); }
    .logo-link:hover { transform: scale(1.04); }
    .logo-link img { height: 52px; width: auto; object-fit: contain; }
    .logo-text { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.28rem; line-height: 1; color: var(--dark); white-space: nowrap; }
    .logo-text span { color: var(--yellow-dark); }

    nav { display: flex; align-items: center; gap: 2px; }
    nav a {
      position: relative;
      font-size: 0.85rem; font-weight: 500; color: var(--gray-900);
      padding: 8px 12px; border-radius: 7px;
      transition: color 0.2s, background 0.2s; white-space: nowrap;
    }
    nav a:hover { color: var(--dark); background: rgba(26,26,26,0.06); }

    .nav-vitrine {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1.5px solid var(--dark); border-radius: 8px;
      padding: 7.5px 14px !important;
      font-weight: 600 !important;
      background: var(--dark); color: var(--white) !important;
    }
    .nav-vitrine svg { width: 14px; height: 14px; flex-shrink: 0; }

    .btn-nav {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--yellow); color: var(--dark) !important;
      padding: 9px 18px; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-nav svg { width: 15px; height: 15px; }
    .btn-nav:hover { background: var(--yellow-light); transform: translateY(-1px); }

    .menu-toggle {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 6px; border: none; background: none;
    }
    .menu-toggle span {
      display: block; width: 24px; height: 2px;
      background: var(--dark); border-radius: 2px; transition: all 0.3s;
    }

    .mobile-nav {
      display: none; position: fixed; left: 0; right: 0;
      background: var(--white); padding: 16px 24px 24px;
      border-bottom: 1px solid var(--gray-200);
      box-shadow: 0 8px 24px rgba(10,10,10,0.09); z-index: 999;
    }
    .mobile-nav.open { display: flex; flex-direction: column; gap: 4px; }
    .mobile-nav a {
      padding: 12px 16px; font-weight: 500; color: var(--text);
      border-radius: 8px; transition: background 0.2s, color 0.2s;
    }
    .mobile-nav a:hover { background: #F1F1EE; color: var(--dark); }
    .mobile-nav .nav-vitrine,
    .mobile-nav .btn-nav { justify-content: center; margin-top: 4px; }

    @media (max-width: 1280px) {
      nav          { display: none; }
      .menu-toggle { display: flex; }
    }

    @media (max-width: 375px) {
      .header-inner  { height: 78px; }
      .logo-link img { height: 38px; }
      .logo-text     { font-size: 1.05rem; }
    }

    /* ===== VITRINE (IFRAME) ===== */
    .vitrine-wrap {
      position: fixed; left: 0; right: 0;
      top: var(--header-h); bottom: var(--badge-h);
      width: 100%;
    }
    .vitrine-wrap iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }
  </style>
</head>

  <!-- ===== VITRINE (IFRAME) ===== -->
  <div class="vitrine-wrap">
    <iframe src="https://hmredarios.egestor.com.br/vitrine/" title="Vitrine online — HM Redários" loading="eager"></iframe>
  </div>

  <script>
    /* Header height muda em telas muito pequenas — ajusta a posição do wrapper dinamicamente */
    var headerEl = document.getElementById('header');
    var wrapEl   = document.querySelector('.vitrine-wrap');
    function syncHeaderHeight() {
      wrapEl.style.top = headerEl.offsetHeight + 'px';
    }
    window.addEventListener('resize', syncHeaderHeight);
    window.addEventListener('orientationchange', syncHeaderHeight);
    syncHeaderHeight();

    /* Menu mobile */
    var toggle = document.getElementById('menuToggle');
    var mobileNav = document.getElementById('mobileNav');
    function positionMobileNav() {
      mobileNav.style.top = headerEl.offsetHeight + 'px';
    }
    positionMobileNav();
    window.addEventListener('resize', positionMobileNav);

    toggle.addEventListener('click', function () {
      var open = mobileNav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    });
    mobileNav.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        mobileNav.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
      });
    });
  </script>
